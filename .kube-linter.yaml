# Repo root: .kube-linter.yaml
#
# kube-linter's default check set is deliberately opinionated. These are the
# ones worth enforcing on the contrib workloads; the rest mostly apply to
# stateful production workloads.
#
# Two things are linted with this file, and they have different shapes:
#
#   contrib/check-endpoint-exporter  a Deployment behind a Service, plus a Helm
#                                    chart. Every check below applies.
#   contrib/check-endpoint-cli       a single ad-hoc debug Pod. Three checks
#                                    below do not apply to it and are waived
#                                    per-object with
#                                    `ignore-check.kube-linter.io/<check>`
#                                    annotations in debug-pod.yaml, each with a
#                                    reason.
#
# Waiving per-object rather than removing checks here is deliberate: the
# exporter still gets probe, tag and resource enforcement, and the reason for
# each exception lives next to the object it applies to.

checks:
  addAllBuiltIn: false
  include:
    # --- security ---
    - run-as-non-root
    - privileged-container
    - privilege-escalation-container
    - no-read-only-root-fs
    - drop-net-raw-capability
    - host-network
    - host-pid
    - host-ipc
    - sensitive-host-mounts
    - ssh-port
    - unsafe-sysctls

    # --- correctness ---
    - dangling-service
    - mismatching-selector
    - non-existent-service-account
    - duplicate-env-var
    - invalid-target-ports
    - env-var-secret

    # --- reliability ---
    - unset-cpu-requirements
    - unset-memory-requirements
    - no-liveness-probe
    - no-readiness-probe
    - latest-tag

  exclude:
    # The exporter is a single stateless replica behind a Service; a
    # PodDisruptionBudget and anti-affinity rules would be noise here.
    - minimum-three-replicas
    - no-anti-affinity

# Deliberately NOT enabled, having seen them fire:
#
#   use-namespace
#     Fired on every object in both the chart and the raw manifests. A Helm
#     chart takes its namespace from `helm install -n`, and raw manifests
#     from `kubectl apply -n`, so hardcoding one into the templates would be
#     worse practice than leaving it out. This check suits a repo that
#     deploys to a fixed namespace, which is not this one.
#
#   required-label-owner
#     Wants an `owner=<any>` label on every workload. That is an
#     organisational convention rather than a defect, and it does not belong
#     in a chart other people are meant to copy.
