# pyproject.toml for bytebeast/check-endpoint
#
# Tooling config only. There is deliberately no [build-system] table: the
# install path is the curl-to-PATH one in the README, not `pip install .`.

[project]
name = "check-endpoint"
# Duplicated as APP_VERSION in check-endpoint.py. Bump both together.
version = "2.7.1"

# THE single source of truth for the minimum Python version.
#
# There is deliberately no [tool.ruff] target-version below. Ruff falls back
# to this value when target-version is unset, taking the LOWER bound of the
# range, so one line keeps ruff, pip and the README in agreement and the two
# settings can never contradict each other.
#
# Raising this to 3.11 or higher switches on rule UP017 ("Use `datetime.UTC`
# alias"), which rewrites the compatibility shim in check-endpoint.py into
# `UTC = UTC` and deletes the `from datetime import timezone` behind it. That
# is a NameError on 3.9 and 3.10, which is the failure the shim prevents.
requires-python = ">=3.9"

[tool.ruff]
# 88 is ruff's default and matches how the script is already written; every
# statement fits. Dropping to 80 rewraps roughly 75 lines.
line-length = 88

exclude = [".git", "__pycache__", ".venv"]

# The exporter ships a copy of the script. Lint it once, not twice.
extend-exclude = ["contrib/check-endpoint-exporter/check-endpoint.py"]

[tool.ruff.lint]
# E4/E7/E9 rather than the whole E group: keeps the real pycodestyle errors
# but drops E501 line-length warnings, which are unfixable noise on comment
# lines because the formatter does not rewrap comments.
# "S" is flake8-bandit, a port of Bandit. Running it here means the security
# job needs no extra tool, and a local `ruff check` tells you the same thing
# CI will.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "S"]

ignore = [
  # S110 try-except-pass. The probe deliberately swallows failures around
  # optional libcurl features (CERTINFO, header decoding, HTTP version
  # lookup) because none of them should abort a measurement. Rewriting
  # these as contextlib.suppress(Exception) would silence the rule properly
  # and read better, if you ever want to.
  "S110",
]

[tool.ruff.lint.per-file-ignores]
# S104 flags `shown = bind or "0.0.0.0"`, which is the string printed in the
# startup banner, not an actual bind address.
# S608 flags the argparse epilog as a SQL injection vector. It is help text.
"check-endpoint.py" = ["S104", "S608"]

# S603 flags every subprocess call that is not shell=True. The arguments are
# hardcoded git invocations from this file, with no user input reaching them.
".github/scripts/release.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra -q"
