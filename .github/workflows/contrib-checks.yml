# .github/workflows/contrib-checks.yml
#
# Lint, validate and security-scan the container and Kubernetes assets under
# contrib/. Every tool here is open source:
#
#   hadolint     Dockerfile linter                    (GPL-3.0)
#   yamllint     YAML style and syntax                (GPL-3.0)
#   docker       `compose config` schema validation   (Apache-2.0)
#   helm         chart linting and rendering          (Apache-2.0)
#   kubeconform  manifest schema validation           (Apache-2.0)
#   kube-linter  Kubernetes best practice / security  (Apache-2.0)
#   trivy        misconfiguration scanning            (Apache-2.0)
#
# Two contrib directories are covered, and they are not symmetrical:
#
#   check-endpoint-exporter  a daemon: Dockerfile, compose file, Helm chart,
#                            manifests under kubernetes/
#   check-endpoint-cli       a command: Dockerfile and a single debug-pod.yaml
#
# So the Dockerfile and manifest jobs run as a matrix over both, while the
# compose and helm jobs stay exporter-only. Jobs run in parallel and are
# independent, so one failure still lets you see every other result.

name: contrib-checks

on:
  push:
    branches: [main]
    paths: &paths
      - "contrib/**"
      - ".github/workflows/contrib-checks.yml"
      - ".hadolint.yaml"
      - ".yamllint.yaml"
      - ".kube-linter.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPORTER: contrib/check-endpoint-exporter
  CHART: contrib/check-endpoint-exporter/helm/check-endpoint-exporter

  # Base URL for the CRDs-catalog JSON schemas. Kept short so the
  # -schema-location lines below stay inside the yamllint line limit. The
  # {{.Group}} placeholders are kubeconform's own templating; GitHub Actions
  # only expands ${{ }}, and bash leaves single braces alone, so neither
  # touches them.
  CRD: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main

jobs:
  # ── Dockerfiles ───────────────────────────────────────────────────────────
  dockerfile:
    name: Dockerfile (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      # Report both Dockerfiles in one run rather than stopping at the first.
      fail-fast: false
      matrix:
        image:
          - check-endpoint-exporter
          - check-endpoint-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: contrib/${{ matrix.image }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  # ── docker-compose (exporter only) ────────────────────────────────────────
  compose:
    name: docker-compose (config validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `compose config` parses the file, resolves the build context and
      # interpolates variables, so it catches schema errors, bad keys and
      # unresolvable paths. The runner ships with Docker, nothing to install.
      #
      # The CLI image has no compose file: it is a command you invoke, not a
      # service you bring up. If one is ever added, make this a matrix too.
      - name: Validate compose schema
        working-directory: contrib/check-endpoint-exporter
        run: docker compose -f docker-compose.yml config --quiet

      - name: Show the resolved config
        working-directory: contrib/check-endpoint-exporter
        run: docker compose -f docker-compose.yml config

  # ── YAML style (all of contrib) ───────────────────────────────────────────
  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yamllint

      # Helm templates are Go templates, not YAML, so they are excluded in
      # .yamllint.yaml. They get validated in the helm job instead, after
      # rendering.
      - name: yamllint
        run: yamllint --strict -c .yamllint.yaml contrib

  # ── Helm chart (exporter only) ────────────────────────────────────────────
  helm:
    name: Helm chart (lint, render, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint "$CHART"

      # Render with default values, and again with everything switched on, so
      # conditional templates such as the ServiceMonitor are actually exercised.
      - name: helm template
        run: |
          mkdir -p /tmp/rendered
          helm template ce "$CHART" > /tmp/rendered/default.yaml
          helm template ce "$CHART" \
            --set serviceMonitor.enabled=true \
            > /tmp/rendered/all.yaml
          wc -l /tmp/rendered/*.yaml

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/

      # The chart ships a ServiceMonitor (monitoring.coreos.com/v1), which is a
      # CRD and has no schema in the upstream Kubernetes JSON schema set. The
      # CRDs-catalog schema location supplies it; without that second
      # -schema-location, this step fails with "could not find schema".
      - name: kubeconform on rendered output
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location "$CRD/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            /tmp/rendered/all.yaml

      - name: kube-linter on rendered output
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: /tmp/rendered
          config: .kube-linter.yaml

  # ── Raw Kubernetes manifests ──────────────────────────────────────────────
  kubernetes:
    name: Manifests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The exporter keeps its manifests in a subdirectory; the CLI has a
          # single debug-pod.yaml at the directory root. kubeconform and
          # kube-linter both walk a directory and only pick up .yaml/.yml/.json,
          # so pointing at the CLI directory itself is safe - the Dockerfile
          # and README are ignored.
          - name: exporter
            path: contrib/check-endpoint-exporter/kubernetes
          - name: cli
            path: contrib/check-endpoint-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/

      - name: kubeconform
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location "$CRD/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${{ matrix.path }}"

      - name: kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: ${{ matrix.path }}
          config: .kube-linter.yaml

  # ── Security / misconfiguration ───────────────────────────────────────────
  security:
    name: Security scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One pass over all of contrib covers both Dockerfiles, the Kubernetes
      # manifests and the Helm chart; trivy understands all three formats
      # natively and walks subdirectories itself.
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: contrib
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: false

      # Informational: everything trivy found, including LOW and MEDIUM, so a
      # failing run above still shows you the full picture.
      - name: trivy config (all severities, informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: contrib
          exit-code: "0"
