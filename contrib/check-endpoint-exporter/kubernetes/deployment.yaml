# Plain manifests for users who do not use Helm.
# Edit the line marked "<-- edit" before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: check-endpoint-exporter
  labels:
    app.kubernetes.io/name: check-endpoint-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: check-endpoint-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: check-endpoint-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/bytebeast/check-endpoint-exporter:3.0.1
          args:
            - --prometheus
            - --prometheus-bind
            - 0.0.0.0
            - --prometheus-port
            - "9109"
            - -c
            - "1"
            # Under the ServiceMonitor's 10s scrapeTimeout, so a hung target
            # still reports check_endpoint_last_error instead of a failed scrape.
            - -t
            - "8"
            - "https://example.com"                  # <-- edit: URL to probe
          ports:
            - name: metrics
              containerPort: 9109
          # /healthz, not the metrics path: any other path probes the target,
          # so a slow target would fail these and restart the exporter.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
